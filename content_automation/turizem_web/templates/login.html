<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventura Travel — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #040d1e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .card {
    background: #0a1628;
    border: 1px solid #1a2a45;
    border-radius: 20px;
    padding: 52px 48px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .brand {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .brand span { color: #1565C0; }

  .sub {
    font-size: 14px;
    color: rgba(255,255,255,0.45);
    margin-bottom: 40px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    text-align: left;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  input[type="password"] {
    width: 100%;
    background: #111e35;
    border: 1.5px solid #1a2a45;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    padding: 14px 18px;
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 24px;
  }

  input[type="password"]:focus { border-color: #1565C0; }

  .btn {
    width: 100%;
    background: #1565C0;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    padding: 15px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.2s;
  }

  .btn:hover { background: #1976D2; }

  .error {
    background: rgba(220,50,50,0.12);
    border: 1px solid rgba(220,50,50,0.35);
    border-radius: 8px;
    color: #ff6b6b;
    font-size: 14px;
    padding: 12px 16px;
    margin-bottom: 20px;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Ventura <span>Travel</span></div>
    <div class="sub">Post Generator</div>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Fjalëkalimi</label>
      <input type="password" name="password" placeholder="••••••••••" autofocus>
      <button class="btn" type="submit">Hyr</button>
    </form>
  </div>
</body>
</html>
