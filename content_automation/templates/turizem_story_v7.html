<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins';  font-weight: 700;    src: url('{{ font_poppins }}')  format('truetype'); }
  @font-face { font-family: 'Exo2';     font-weight: 600;    src: url('{{ font_exo2 }}')     format('opentype'); }
  @font-face { font-family: 'Biryani';  font-weight: normal; src: url('{{ font_biryani }}')  format('truetype'); }
  @font-face { font-family: 'Bigtimes'; font-weight: normal; src: url('{{ font_bigtimes }}') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #040d1e;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  /* ── Background photo fills LEFT ── */
  .bg {
    position: absolute;
    top: 0; left: 0;
    width: calc(1080px - 380px);
    height: 1920px;
    background-image: url('{{ bg_image }}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* Soft shadow from panel bleeding onto photo */
  .bg::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 90px;
    background: linear-gradient(to left, rgba(4,13,30,0.75) 0%, transparent 100%);
  }

  /* ── Right dark panel ── */
  .panel {
    position: absolute;
    top: 0; right: 0;
    width: 380px;
    height: 1920px;
    background: linear-gradient(190deg, #040d1e 0%, #0a1a3a 60%, #040d1e 100%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 32px 52px;
  }

  /* Left edge accent line */
  .panel::before {
    content: '';
    position: absolute;
    top: 80px; bottom: 80px; left: 0;
    width: 2px;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(33,133,224,0.5) 15%,
      rgba(33,133,224,0.85) 50%,
      rgba(33,133,224,0.5) 85%,
      transparent 100%
    );
  }

  /* ── Venture icon ── */
  .icon-wrap {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(33,133,224,0.15);
    border: 2px solid rgba(33,133,224,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
    box-shadow: 0 0 32px rgba(33,133,224,0.3);
  }

  .icon-wrap img {
    width: 68px;
    height: 68px;
    object-fit: contain;
  }

  /* Agency name */
  .agency-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(33,133,224,0.8);
    margin-bottom: 16px;
    text-align: center;
  }

  /* ── Destination stacked large ── */
  .destination-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 0;
  }

  /* Each letter of destination stacked */
  .destination-letters {
    font-family: 'Bigtimes', serif;
    font-size: 92px;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0px;
    text-align: center;
    line-height: 0.88;
    text-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 40px rgba(33,133,224,0.15);
  }

  /* ── Decorative lines around destination ── */
  .deco-line {
    width: 48px;
    height: 2px;
    background: rgba(33,133,224,0.6);
    margin: 24px auto;
  }

  /* ── Price badge ── */
  .price-badge {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 52px;
    padding: 12px 44px;
    border-radius: 60px;
    white-space: nowrap;
    border: 1.5px solid rgba(255,255,255,0.35);
    box-shadow: 0 8px 28px rgba(21,101,192,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    margin-bottom: 32px;
  }

  /* ── Divider ── */
  .divider {
    width: 240px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
    margin-bottom: 28px;
  }

  /* ── Contact block ── */
  .contact-block {
    text-align: center;
    margin-bottom: 40px;
  }

  .c-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    display: block;
    margin-bottom: 5px;
  }

  .c-phone {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: #ffffff;
  }

  /* ── Includes at bottom ── */
  .includes-line {
    font-family: 'Biryani', sans-serif;
    font-size: 16px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.5;
  }
  .includes-line.hidden { display: none; }

  /* ── Event badge on photo (top-left) ── */
  .event-badge {
    position: absolute;
    top: 48px;
    left: 48px;
    background: linear-gradient(135deg, #2185e0, #1565C0);
    color: #fff;
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 40px;
    border: 1.5px solid rgba(255,255,255,0.35);
    z-index: 20;
    white-space: nowrap;
  }
  .event-badge.hidden { display: none; }
</style>
</head>
<body>
<div class="canvas">

  <!-- Photo on left -->
  <div class="bg"></div>

  <!-- Event badge -->
  <div class="event-badge {{ event_badge_hidden }}">{{ event_badge }}</div>

  <!-- Right panel -->
  <div class="panel">
    <div class="icon-wrap">
      <img src="{{ venture_icon_white }}" alt="">
    </div>

    <div class="agency-label">Ventura Travel</div>

    <div class="destination-wrap">
      <div class="deco-line"></div>
      <div class="destination-letters" id="destText">{{ destination }}</div>
      <div class="deco-line"></div>
    </div>

    <div class="price-badge">{{ price }}€</div>
    <div class="divider"></div>

    <div class="contact-block">
      <span class="c-label">Reservo Tani</span>
      <span class="c-phone">049/45&nbsp;725–726</span>
    </div>

    <div class="includes-line {{ includes_hidden }}">Në çmim:<br>{{ includes_text }}</div>
  </div>

</div>

<script>
  (function () {
    var el = document.getElementById('destText');
    // For vertical layout, constrain width
    var maxW = 310;
    var hi = 92, lo = 28, best = 64;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxW) { best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  })();
</script>
</body>
</html>
