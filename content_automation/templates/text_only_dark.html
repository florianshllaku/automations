<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Heading';
    src: url('{{ brand.font_files.heading }}');
  }
  @font-face {
    font-family: 'Body';
    src: url('{{ brand.font_files.body }}');
  }

  body {
    width: {{ width }}px;
    height: {{ height }}px;
    background-color: {{ brand.primary_color }};
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 92px 80px;
    overflow: hidden;
  }

  /* TOP: Logo */
  .logo-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .logo {
    height: 52px;
    opacity: 0.95;
  }

  /* MIDDLE: Main content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 32px;
  }

  .accent-bar {
    width: 64px;
    height: 6px;
    background-color: {{ brand.accent_color }};
    border-radius: 3px;
  }

  .headline {
    font-family: 'Heading', 'Montserrat', sans-serif;
    font-size: 88px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 1.05;
    letter-spacing: -1px;
    word-break: break-word;
  }

  .body-text {
    font-family: 'Body', 'Inter', sans-serif;
    font-size: 38px;
    color: rgba(255,255,255,0.75);
    line-height: 1.5;
    max-width: 820px;
  }

  /* BOTTOM: Business name + subtitle safe zone */
  .bottom-row {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 20px; /* subtitle safe zone */
  }

  .divider {
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,0.15);
  }

  .business-name {
    font-family: 'Heading', 'Montserrat', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: {{ brand.accent_color }};
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="logo-row">
    {% if logo_path %}
      <img class="logo" src="{{ logo_path }}" alt="logo">
    {% endif %}
  </div>

  <div class="content">
    <div class="accent-bar"></div>
    <div class="headline">{{ headline }}</div>
    <div class="body-text">{{ body_text }}</div>
  </div>

  <div class="bottom-row">
    <div class="divider"></div>
    <div class="business-name">{{ business.name }}</div>
  </div>

</body>
</html>
