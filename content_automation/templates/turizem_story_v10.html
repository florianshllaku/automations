<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins';  font-weight: 700;    src: url('{{ font_poppins }}')  format('truetype'); }
  @font-face { font-family: 'Exo2';     font-weight: 600;    src: url('{{ font_exo2 }}')     format('opentype'); }
  @font-face { font-family: 'Biryani';  font-weight: normal; src: url('{{ font_biryani }}')  format('truetype'); }
  @font-face { font-family: 'Bigtimes'; font-weight: normal; src: url('{{ font_bigtimes }}') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #040d1e;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  /* ── Full-bleed photo ── */
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('{{ bg_image }}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* Subtle overall darkening so card reads well */
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(4,13,30,0.38);
  }

  /* ── Event badge top-right ── */
  .event-badge {
    position: absolute;
    top: 52px;
    right: 52px;
    background: linear-gradient(135deg, #2185e0, #1565C0);
    color: #fff;
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 40px;
    border: 1.5px solid rgba(255,255,255,0.35);
    z-index: 30;
    white-space: nowrap;
  }
  .event-badge.hidden { display: none; }

  /* ── Venture icon top-left ── */
  .icon-topleft {
    position: absolute;
    top: 52px;
    left: 52px;
    width: 64px;
    height: 64px;
    z-index: 30;
    opacity: 0.85;
  }
  .icon-topleft img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
  }

  /* ── Center card ── */
  .card {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    width: 880px;
    min-height: 600px;
    background: rgba(4,13,30,0.78);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 32px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 64px 48px;
    backdrop-filter: blur(8px);
    box-shadow:
      0 32px 80px rgba(0,0,0,0.55),
      0 0 0 1px rgba(33,133,224,0.1),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* Glowing top edge on card */
  .card::before {
    content: '';
    position: absolute;
    top: -2px; left: 10%; right: 10%;
    height: 2px;
    border-radius: 0 0 4px 4px;
    background: linear-gradient(to right,
      transparent,
      rgba(33,133,224,0.5) 20%,
      rgba(33,133,224,0.9) 50%,
      rgba(33,133,224,0.5) 80%,
      transparent
    );
  }

  /* ── Icon top center of card ── */
  .icon-wrap {
    width: 104px;
    height: 104px;
    border-radius: 50%;
    background: rgba(33,133,224,0.2);
    border: 2px solid rgba(33,133,224,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 36px;
    box-shadow:
      0 0 0 10px rgba(33,133,224,0.06),
      0 0 0 20px rgba(33,133,224,0.03),
      0 12px 36px rgba(21,101,192,0.4);
  }

  .icon-wrap img {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  /* ── Destination ── */
  .destination-text {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 88px;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-align: center;
    line-height: 1;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
    margin-bottom: 8px;
  }

  .agency-sub {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 5px;
    color: rgba(33,133,224,0.85);
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  /* ── Thin card divider ── */
  .card-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(255,255,255,0.25) 20%,
      rgba(255,255,255,0.25) 80%,
      transparent 100%
    );
    margin-bottom: 32px;
  }

  /* ── Price + contact row ── */
  .info-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 36px;
    width: 100%;
    margin-bottom: 36px;
  }

  .price-badge {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 60px;
    padding: 14px 52px;
    border-radius: 60px;
    border: 1.5px solid rgba(255,255,255,0.38);
    box-shadow: 0 8px 28px rgba(21,101,192,0.5), inset 0 1px 0 rgba(255,255,255,0.22);
    white-space: nowrap;
  }

  .divider-v {
    width: 1px;
    height: 72px;
    background: rgba(255,255,255,0.2);
    flex-shrink: 0;
  }

  .contact-block {
    text-align: center;
  }

  .c-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    display: block;
    margin-bottom: 5px;
  }

  .c-phone {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: #ffffff;
    white-space: nowrap;
  }

  /* ── Includes at card bottom ── */
  .includes-line {
    font-family: 'Biryani', sans-serif;
    font-size: 19px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.5;
  }
  .includes-line.hidden { display: none; }
</style>
</head>
<body>
<div class="canvas">

  <div class="bg"></div>

  <!-- Corner decorations -->
  <div class="icon-topleft">
    <img src="{{ venture_icon_white }}" alt="">
  </div>
  <div class="event-badge {{ event_badge_hidden }}">{{ event_badge }}</div>

  <!-- Center card -->
  <div class="card">

    <div class="icon-wrap">
      <img src="{{ venture_icon_white }}" alt="">
    </div>

    <div class="destination-text" id="destText">{{ destination }}</div>
    <div class="agency-sub">Ventura Travel</div>

    <div class="card-divider"></div>

    <div class="info-row">
      <div class="price-badge">{{ price }}€</div>
      <div class="divider-v"></div>
      <div class="contact-block">
        <span class="c-label">Reservo Tani</span>
        <span class="c-phone">049/45&nbsp;725–726</span>
      </div>
    </div>

    <div class="includes-line {{ includes_hidden }}">Në çmim: {{ includes_text }}</div>

  </div>

</div>

<script>
  (function () {
    var el = document.getElementById('destText');
    var maxW = 760;
    var hi = 88, lo = 32, best = 64;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxW) { best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  })();
</script>
</body>
</html>
