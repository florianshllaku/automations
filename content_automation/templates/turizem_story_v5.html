<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins';  font-weight: 700;    src: url('{{ font_poppins }}')  format('truetype'); }
  @font-face { font-family: 'Exo2';     font-weight: 600;    src: url('{{ font_exo2 }}')     format('opentype'); }
  @font-face { font-family: 'Biryani';  font-weight: normal; src: url('{{ font_biryani }}')  format('truetype'); }
  @font-face { font-family: 'Bigtimes'; font-weight: normal; src: url('{{ font_bigtimes }}') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #040d1e;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  /* ── Full-bleed background fills bottom portion ── */
  .bg {
    position: absolute;
    top: 200px; left: 0; right: 0; bottom: 0;
    background-image: url('{{ bg_image }}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* Inner shadow from bar bleeding down into photo */
  .bg::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(to bottom, rgba(4,13,30,0.7) 0%, transparent 100%);
  }

  /* ── Dark top bar ── */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 200px;
    background: linear-gradient(180deg, #040d1e 0%, #0b1a38 100%);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 52px;
    gap: 24px;
  }

  /* Bottom border glow on top bar */
  .top-bar::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(33,133,224,0.5) 15%,
      rgba(33,133,224,0.9) 50%,
      rgba(33,133,224,0.5) 85%,
      transparent 100%
    );
  }

  /* ── Destination pill in bar ── */
  .dest-pill {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 52px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 16px 44px;
    border-radius: 60px;
    white-space: nowrap;
    border: 1.5px solid rgba(255,255,255,0.38);
    box-shadow: 0 8px 28px rgba(21,101,192,0.5);
    flex-shrink: 0;
  }

  /* ── Divider lines + icon center ── */
  .center-wings {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 8px;
    min-width: 0;
  }

  .wing-line {
    flex: 1;
    height: 2px;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.4));
  }
  .wing-line.right {
    background: linear-gradient(to left, transparent, rgba(255,255,255,0.4));
  }

  .icon-circle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-circle img {
    width: 62px;
    height: 62px;
    object-fit: contain;
  }

  /* ── Contact pill in bar ── */
  .contact-pill {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    border-radius: 60px;
    border: 1.5px solid rgba(255,255,255,0.38);
    box-shadow: 0 8px 28px rgba(21,101,192,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 36px;
    gap: 3px;
    flex-shrink: 0;
  }

  .c-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
  }

  .c-phone {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 32px;
    color: #ffffff;
    white-space: nowrap;
  }

  /* ── Price badge floating below bar ── */
  .price-float {
    position: absolute;
    top: 156px; /* overlaps border: sticks out from bar */
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 60px;
    padding: 16px 60px;
    border-radius: 60px;
    border: 2px solid rgba(255,255,255,0.4);
    box-shadow: 0 12px 40px rgba(21,101,192,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
    white-space: nowrap;
  }

  /* ── Bottom gradient + includes ── */
  .overlay-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    background: linear-gradient(to top, rgba(4,13,30,0.82) 0%, transparent 100%);
    z-index: 5;
  }

  .includes-line {
    position: absolute;
    bottom: 40px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Biryani', sans-serif;
    font-size: 20px;
    color: rgba(255,255,255,0.78);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    z-index: 10;
  }
  .includes-line.hidden { display: none; }

  /* ── Event badge ── */
  .event-badge {
    position: absolute;
    top: 214px;
    right: 48px;
    background: linear-gradient(135deg, #2185e0, #1565C0);
    color: #fff;
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 40px;
    border: 1.5px solid rgba(255,255,255,0.35);
    z-index: 20;
    white-space: nowrap;
  }
  .event-badge.hidden { display: none; }
</style>
</head>
<body>
<div class="canvas">

  <div class="bg"></div>
  <div class="overlay-bottom"></div>

  <!-- Dark top bar -->
  <div class="top-bar">
    <div class="dest-pill" id="destPill">{{ destination }}</div>

    <div class="center-wings">
      <div class="wing-line"></div>
      <div class="icon-circle">
        <img src="{{ venture_icon_white }}" alt="">
      </div>
      <div class="wing-line right"></div>
    </div>

    <div class="contact-pill">
      <span class="c-label">Reservo Tani</span>
      <span class="c-phone">049/45&nbsp;725–726</span>
    </div>
  </div>

  <!-- Price badge floating below bar -->
  <div class="price-float">{{ price }}€</div>

  <!-- Event badge -->
  <div class="event-badge {{ event_badge_hidden }}">{{ event_badge }}</div>

  <!-- Includes at bottom edge -->
  <div class="includes-line {{ includes_hidden }}">Në çmim përfshihet: {{ includes_text }}</div>

</div>

<script>
  (function () {
    var el = document.getElementById('destPill');
    var maxW = 320;
    var hi = 52, lo = 22, best = 38;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxW) { best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  })();
</script>
</body>
</html>
