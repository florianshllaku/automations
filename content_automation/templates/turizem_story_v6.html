<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins';  font-weight: 700;    src: url('{{ font_poppins }}')  format('truetype'); }
  @font-face { font-family: 'Exo2';     font-weight: 600;    src: url('{{ font_exo2 }}')     format('opentype'); }
  @font-face { font-family: 'Biryani';  font-weight: normal; src: url('{{ font_biryani }}')  format('truetype'); }
  @font-face { font-family: 'Bigtimes'; font-weight: normal; src: url('{{ font_bigtimes }}') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #040d1e;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  /* ── Photo fills the middle band ── */
  .bg {
    position: absolute;
    top: 120px; left: 0; right: 0;
    height: calc(1920px - 120px - 160px);
    background-image: url('{{ bg_image }}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* ── TOP black bar (120px) ── */
  .bar-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 120px;
    background: #040d1e;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 52px;
  }

  /* Glowing bottom edge of top bar */
  .bar-top::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(33,133,224,0.4) 15%,
      rgba(33,133,224,0.85) 50%,
      rgba(33,133,224,0.4) 85%,
      transparent 100%
    );
  }

  /* ── BOTTOM black bar (160px) ── */
  .bar-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
    background: #040d1e;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
    gap: 20px;
  }

  /* Glowing top edge of bottom bar */
  .bar-bottom::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(33,133,224,0.4) 15%,
      rgba(33,133,224,0.85) 50%,
      rgba(33,133,224,0.4) 85%,
      transparent 100%
    );
  }

  /* ── Includes in top bar ── */
  .includes-line {
    font-family: 'Biryani', sans-serif;
    font-size: 20px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-align: center;
  }
  .includes-line.hidden { display: none; }

  /* ── Bottom bar content ── */
  .dest-text {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 68px;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1;
    flex-shrink: 0;
  }

  .center-zone {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .icon-circle {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.45);
    background: rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-circle img {
    width: 54px;
    height: 54px;
    object-fit: contain;
  }

  .right-zone {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-shrink: 0;
  }

  .price-badge {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 52px;
    padding: 10px 40px;
    border-radius: 60px;
    border: 1.5px solid rgba(255,255,255,0.38);
    box-shadow: 0 6px 24px rgba(21,101,192,0.5);
    white-space: nowrap;
  }

  .divider-v {
    width: 1px;
    height: 80px;
    background: rgba(255,255,255,0.25);
  }

  .contact-block {
    text-align: left;
  }

  .c-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.58);
    display: block;
    margin-bottom: 4px;
  }

  .c-phone {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: #ffffff;
    white-space: nowrap;
  }

  /* ── Event badge on photo ── */
  .event-badge {
    position: absolute;
    top: 156px;
    right: 48px;
    background: linear-gradient(135deg, #2185e0, #1565C0);
    color: #fff;
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 40px;
    border: 1.5px solid rgba(255,255,255,0.35);
    z-index: 20;
    white-space: nowrap;
  }
  .event-badge.hidden { display: none; }

  /* ── Venture icon top-left of top bar ── */
  .icon-topleft {
    position: absolute;
    top: 50%;
    left: 52px;
    transform: translateY(-50%);
    width: 52px;
    height: 52px;
  }

  .icon-topleft img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Photo in middle band -->
  <div class="bg"></div>

  <!-- TOP BAR -->
  <div class="bar-top">
    <div class="icon-topleft">
      <img src="{{ venture_icon_white }}" alt="">
    </div>
    <div class="includes-line {{ includes_hidden }}">Në çmim përfshihet: {{ includes_text }}</div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bar-bottom">
    <div class="dest-text" id="destText">{{ destination }}</div>

    <div class="center-zone">
      <div class="icon-circle">
        <img src="{{ venture_icon_white }}" alt="">
      </div>
    </div>

    <div class="right-zone">
      <div class="price-badge">{{ price }}€</div>
      <div class="divider-v"></div>
      <div class="contact-block">
        <span class="c-label">Reservo Tani</span>
        <span class="c-phone">049/45&nbsp;725–726</span>
      </div>
    </div>
  </div>

  <!-- Event badge -->
  <div class="event-badge {{ event_badge_hidden }}">{{ event_badge }}</div>

</div>

<script>
  (function () {
    var el = document.getElementById('destText');
    var maxW = 280;
    var hi = 68, lo = 24, best = 48;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxW) { best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  })();
</script>
</body>
</html>
