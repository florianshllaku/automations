<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Poppins';
    font-weight: 700;
    src: url('{{ font_bold }}') format('truetype');
  }
  @font-face {
    font-family: 'Poppins';
    font-weight: 600;
    src: url('{{ font_semibold }}') format('truetype');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #FF680B;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    background: #FF680B;
  }

  /* ── Logo — top center, forced white ── */
  .logo-wrap {
    position: absolute;
    top: 50px;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    z-index: 20;
  }

  .logo-wrap img {
    width: 220px;
    height: auto;
    object-fit: contain;
    filter: brightness(0) invert(1);
  }

  /* ── Content block — sits below logo ── */
  .bottom-block {
    position: absolute;
    top: 220px;
    left: 0; right: 0;
    padding: 0 76px;
    z-index: 20;
    text-align: left;
  }

  /* Black accent bar */
  .accent-bar {
    width: 60px;
    height: 6px;
    background: #080808;
    border-radius: 3px;
    margin-top: 26px;
  }

  /* Main post text — white, font-size set by JS */
  .post-text {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 120px;
    line-height: 1.05;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: -1.5px;
    margin-bottom: 0;
    word-break: break-word;
    white-space: pre-line;
  }

  /* Black keyword highlight (inverted from default orange) */
  .post-text .hl {
    color: #080808;
  }

  /* Optional CTA button */
  .cta-button {
    display: none;
    background: #080808;
    color: #FFFFFF;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 28px;
    padding: 18px 48px;
    border-radius: 50px;
    letter-spacing: 0.4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.30);
  }

  .cta-button.visible {
    display: inline-block;
  }

  /* Bottom brand tag */
  .brand-tag {
    position: absolute;
    bottom: 48px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 2px;
    color: #080808;
    z-index: 20;
  }

</style>
</head>
<body>
  <div class="canvas">

    <!-- Logo -->
    <div class="logo-wrap">
      <img src="{{ logo }}" alt="Sharp Group">
    </div>

    <!-- Content block -->
    <div class="bottom-block">
      <div class="post-text">{{ post_text }}</div>
      <div class="accent-bar"></div>
      <div class="cta-button">{{ cta_text }}</div>
    </div>

    <!-- Brand tag -->
    <div class="brand-tag">SHARP GROUP</div>

  </div>

  <script>
    (function () {
      var el      = document.querySelector('.post-text');
      var MAX     = 4;
      var LINE_H  = 1.05;
      var MIN_PX  = 32;
      var MAX_PX  = 160;

      var lo = MIN_PX, hi = MAX_PX, best = MIN_PX;
      while (lo <= hi) {
        var mid = Math.floor((lo + hi) / 2);
        el.style.fontSize = mid + 'px';
        var lh    = mid * LINE_H;
        var lines = Math.round(el.scrollHeight / lh);
        if (lines <= MAX) {
          best = mid;
          lo   = mid + 1;
        } else {
          hi   = mid - 1;
        }
      }
      el.style.fontSize = best + 'px';
    })();
  </script>
</body>
</html>
