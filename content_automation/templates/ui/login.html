{% extends "base.html" %}
{% block title %}Login — Sharp Group Studio{% endblock %}

{% block head %}
<style>
  body {
    background: var(--black);
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
    overflow: hidden;
  }

  /* Ambient glow */
  .bg-glow {
    position: fixed; top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,104,11,0.12) 0%, transparent 65%);
    pointer-events: none;
  }

  .login-wrap {
    position: relative; z-index: 1;
    width: 100%; max-width: 420px; padding: 24px;
  }

  .logo-area {
    text-align: center; margin-bottom: 40px;
  }
  .logo-area .brand-name {
    font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    margin-top: 16px;
  }
  .logo-area .brand-name span { color: var(--orange); }
  .logo-area .brand-sub {
    font-size: 12px; color: var(--gray); font-weight: 400;
    letter-spacing: 3px; text-transform: uppercase; margin-top: 6px;
  }

  .card {
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
  }

  .card h2 {
    font-size: 20px; font-weight: 700; margin-bottom: 6px;
  }
  .card p {
    font-size: 13px; color: var(--gray); margin-bottom: 32px;
  }

  .field label {
    display: block; font-size: 12px; font-weight: 600;
    letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--gray); margin-bottom: 10px;
  }
  .field input {
    width: 100%; background: var(--dark2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 18px;
    font-size: 15px; color: var(--white); outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--orange); }
  .field input::placeholder { color: var(--gray); }

  .error-msg {
    background: rgba(255,60,60,0.12); border: 1px solid rgba(255,60,60,0.25);
    border-radius: 10px; padding: 12px 16px;
    font-size: 13px; color: #ff6b6b; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }

  .login-btn {
    width: 100%; margin-top: 24px;
    background: var(--orange); color: #fff; border: none;
    border-radius: 50px; padding: 15px;
    font-size: 15px; font-weight: 700; letter-spacing: 0.3px;
    cursor: pointer; transition: all 0.2s;
  }
  .login-btn:hover { background: #e55900; box-shadow: 0 4px 24px rgba(255,104,11,0.4); transform: translateY(-1px); }

  .footer-note {
    text-align: center; margin-top: 20px;
    font-size: 12px; color: var(--gray);
  }
  .footer-note span { color: var(--orange); }

  /* Password eye toggle */
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 48px; }
  .eye-btn {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--gray); cursor: pointer;
    font-size: 18px; line-height: 1; padding: 0;
  }
  .eye-btn:hover { color: var(--white); }
</style>
{% endblock %}

{% block body %}
<div class="bg-glow"></div>

<div class="login-wrap">
  <div class="logo-area">
    <div class="brand-name">SHARP <span>GROUP</span></div>
    <div class="brand-sub">Content Studio</div>
  </div>

  <div class="card">
    <h2>Mirë se erdhe</h2>
    <p>Hyr në llogarinë tënde për të vazhduar.</p>

    {% if error %}
    <div class="error-msg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="field">
        <label>Fjalëkalimi</label>
        <div class="pass-wrap">
          <input type="password" name="password" id="pwdInput" placeholder="Shkruaj fjalëkalimin..." required autofocus>
          <button type="button" class="eye-btn" onclick="togglePwd()" id="eyeBtn">
            <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-btn">Hyr</button>
    </form>
  </div>

  <div class="footer-note">
    Sharp Group Studio &nbsp;·&nbsp; <span>v1.0</span>
  </div>
</div>

<script>
function togglePwd() {
  const input = document.getElementById('pwdInput');
  const open = document.getElementById('eyeOpen');
  const closed = document.getElementById('eyeClosed');
  if (input.type === 'password') {
    input.type = 'text';
    open.style.display = 'none';
    closed.style.display = 'inline';
  } else {
    input.type = 'password';
    open.style.display = 'inline';
    closed.style.display = 'none';
  }
}
</script>
{% endblock %}
