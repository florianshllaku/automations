<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins';  font-weight: 700;    src: url('{{ font_poppins }}')  format('truetype'); }
  @font-face { font-family: 'Exo2';     font-weight: 600;    src: url('{{ font_exo2 }}')     format('opentype'); }
  @font-face { font-family: 'Biryani';  font-weight: normal; src: url('{{ font_biryani }}')  format('truetype'); }
  @font-face { font-family: 'Bigtimes'; font-weight: normal; src: url('{{ font_bigtimes }}') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #040d1e;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  /* ── Full-bleed background photo ── */
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('{{ bg_image }}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* Bottom gradient for legibility */
  .overlay-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 380px;
    background: linear-gradient(to top,
      rgba(4,13,30,0.92) 0%,
      rgba(4,13,30,0.65) 55%,
      transparent 100%
    );
    z-index: 2;
  }

  /* Top vignette */
  .overlay-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 200px;
    background: linear-gradient(to bottom, rgba(4,13,30,0.4) 0%, transparent 100%);
    z-index: 2;
  }

  /* ── Venture icon top-right ── */
  .icon-corner {
    position: absolute;
    top: 52px;
    right: 52px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    backdrop-filter: blur(4px);
  }

  .icon-corner img {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }

  /* ── Event badge ── */
  .event-badge {
    position: absolute;
    top: 52px;
    left: 52px;
    background: linear-gradient(135deg, #2185e0, #1565C0);
    color: #fff;
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 12px 32px;
    border-radius: 40px;
    border: 1.5px solid rgba(255,255,255,0.35);
    z-index: 20;
    white-space: nowrap;
  }
  .event-badge.hidden { display: none; }

  /* ── TICKER ROW — one horizontal row near bottom ── */
  .ticker-row {
    position: absolute;
    bottom: 128px;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 0 40px;
  }

  /* Destination pill */
  .dest-pill {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 44px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 14px 40px;
    border-radius: 60px;
    white-space: nowrap;
    border: 1.5px solid rgba(255,255,255,0.38);
    box-shadow: 0 8px 28px rgba(21,101,192,0.5), inset 0 1px 0 rgba(255,255,255,0.22);
    flex-shrink: 0;
  }

  /* Separator dash */
  .sep {
    width: 32px;
    height: 2px;
    background: rgba(255,255,255,0.45);
    flex-shrink: 0;
  }

  /* Icon circle in ticker */
  .icon-ticker {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 0 0 8px rgba(255,255,255,0.04);
  }

  .icon-ticker img {
    width: 62px;
    height: 62px;
    object-fit: contain;
  }

  /* Price badge in ticker */
  .price-badge {
    background: rgba(4,13,30,0.75);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 44px;
    padding: 14px 40px;
    border-radius: 60px;
    white-space: nowrap;
    border: 2px solid rgba(33,133,224,0.6);
    box-shadow: 0 0 24px rgba(33,133,224,0.3);
    flex-shrink: 0;
  }

  /* Contact text */
  .contact-ticker {
    flex-shrink: 0;
    text-align: center;
  }

  .c-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    display: block;
    margin-bottom: 4px;
  }

  .c-phone {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 28px;
    color: #ffffff;
  }

  /* ── Includes line at bottom ── */
  .includes-line {
    position: absolute;
    bottom: 40px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Biryani', sans-serif;
    font-size: 20px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    z-index: 10;
  }
  .includes-line.hidden { display: none; }
</style>
</head>
<body>
<div class="canvas">

  <div class="bg"></div>
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  <!-- Corner icon -->
  <div class="icon-corner">
    <img src="{{ venture_icon_white }}" alt="">
  </div>

  <!-- Event badge -->
  <div class="event-badge {{ event_badge_hidden }}">{{ event_badge }}</div>

  <!-- Ticker row -->
  <div class="ticker-row">
    <div class="dest-pill" id="destPill">{{ destination }}</div>
    <div class="sep"></div>
    <div class="icon-ticker">
      <img src="{{ venture_icon_white }}" alt="">
    </div>
    <div class="sep"></div>
    <div class="price-badge">{{ price }}€</div>
    <div class="sep"></div>
    <div class="contact-ticker">
      <span class="c-label">Reservo Tani</span>
      <span class="c-phone">049/45&nbsp;725–726</span>
    </div>
  </div>

  <!-- Includes -->
  <div class="includes-line {{ includes_hidden }}">Në çmim përfshihet: {{ includes_text }}</div>

</div>

<script>
  (function () {
    var el = document.getElementById('destPill');
    var maxW = 280;
    var hi = 44, lo = 20, best = 34;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxW) { best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  })();
</script>
</body>
</html>
