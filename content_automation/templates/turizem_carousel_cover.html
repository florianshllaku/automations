<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url('{{ font_poppins }}') format('truetype'); }
  @font-face { font-family: 'BrittanySignature'; src: url('{{ font_brittany }}') format('truetype'); }
  @font-face { font-family: 'Exo2'; font-weight: 600; src: url('{{ font_exo2 }}') format('opentype'); }
  @font-face { font-family: 'Biryani'; src: url('{{ font_biryani }}') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { width: 1080px; height: 1080px; overflow: hidden; background: #040d1e; }
  .canvas { position: relative; width: 1080px; height: 1080px; }

  .bg {
    position: absolute; inset: 0;
    background-image: url('{{ bg_image }}');
    background-size: cover; background-position: center;
    z-index: 1;
  }

  /* Strong top dark vignette for logo + text readability */
  .overlay-top {
    position: absolute; top: 0; left: 0; right: 0; height: 340px;
    background: linear-gradient(to bottom,
      rgba(4,13,40,0.94) 0%,
      rgba(4,13,40,0.60) 60%,
      transparent 100%);
    z-index: 2;
  }

  /* Bottom dark zone for the info panel */
  .overlay-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 440px;
    background: linear-gradient(to top,
      rgba(4,13,40,0.98) 0%,
      rgba(4,13,40,0.82) 40%,
      rgba(4,13,40,0.20) 70%,
      transparent 100%);
    z-index: 2;
  }

  /* ── Logo ── */
  .logo-wrap {
    position: absolute; top: 30px; left: 0; right: 0;
    display: flex; justify-content: center; z-index: 10;
  }
  .logo-wrap img { height: 86px; width: auto; object-fit: contain; }

  /* ── Top content: badge + city + divider + hotel ── */
  .top-block {
    position: absolute; top: 134px; left: 60px; right: 60px;
    display: flex; flex-direction: column; align-items: center;
    z-index: 10; gap: 6px;
  }

  /* Event / offer badge */
  .event-badge {
    background: #1565C0;
    color: #fff;
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 24px; letter-spacing: 4px; text-transform: uppercase;
    padding: 9px 40px; border-radius: 50px;
    margin-bottom: 4px;
  }
  .event-badge.hidden { display: none; }

  /* Big script destination — JS auto-sizes */
  .destination-script {
    font-family: 'BrittanySignature', sans-serif;
    font-size: 150px;
    color: #fff;
    line-height: 1.0;
    white-space: nowrap;
    text-shadow: 0 3px 28px rgba(0,0,0,0.55);
  }

  /* Slim decorative divider */
  .divider {
    display: flex; align-items: center; gap: 20px;
    width: 100%; justify-content: center;
    margin: 2px 0;
  }
  .div-line { width: 130px; height: 1px; background: rgba(255,255,255,0.28); }
  .div-diamond {
    width: 9px; height: 9px;
    background: #1565C0;
    transform: rotate(45deg);
    border-radius: 2px;
  }

  /* Hotel label + name */
  .hotel-row {
    display: flex; align-items: center; gap: 14px; margin-top: 2px;
  }
  .hotel-pill {
    background: #1565C0; color: #fff;
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 18px; letter-spacing: 2.5px; text-transform: uppercase;
    padding: 7px 20px; border-radius: 8px; flex-shrink: 0;
  }
  .hotel-name {
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 40px; color: #fff; text-transform: uppercase;
    letter-spacing: 0.5px; white-space: nowrap;
  }

  /* ── Bottom info panel (frosted glass) ── */
  .bottom-panel {
    position: absolute; bottom: 38px; left: 52px; right: 52px;
    z-index: 10;
    background: rgba(4, 13, 40, 0.52);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 22px;
    display: flex; align-items: stretch;
    overflow: hidden;
  }

  .bp-col {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 12px; gap: 5px;
  }

  .bp-sep {
    width: 1px; background: rgba(255,255,255,0.13);
    margin: 18px 0;
  }

  .bp-label {
    font-family: 'Biryani', sans-serif;
    font-size: 16px; color: rgba(255,255,255,0.45);
    letter-spacing: 1.5px; text-transform: uppercase;
  }

  .bp-dur-row {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 28px; color: #fff;
  }
  .bp-dur-row img { width: 30px; height: 30px; object-fit: contain; }

  .bp-dur-sep {
    width: 1px; height: 24px; background: rgba(255,255,255,0.25);
    margin: 0 4px;
  }

  .bp-price {
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 62px; color: #4fc3f7;
    line-height: 1.0; letter-spacing: -1.5px;
  }
  .bp-per {
    font-family: 'Biryani', sans-serif;
    font-size: 17px; color: rgba(255,255,255,0.50); letter-spacing: 0.5px;
  }

  .bp-date {
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 26px; color: #fff; text-align: center;
    line-height: 1.2;
  }

  /* ── Swipe hint ── */
  .swipe-pill {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 20;
    background: rgba(21,101,192,0.80);
    border-radius: 20px 0 0 20px;
    padding: 14px 10px 14px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .swipe-arrow {
    font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 26px; color: #fff; line-height: 1;
  }
  .swipe-dots { display: flex; gap: 4px; }
  .swipe-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(255,255,255,0.50);
  }
  .swipe-dot.active { background: #fff; }

</style>
</head>
<body>
<div class="canvas">

  <div class="bg"></div>
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  <!-- Logo -->
  <div class="logo-wrap">
    <img src="{{ logo }}" alt="Ventura Travel">
  </div>

  <!-- Top: badge + script city + divider + hotel -->
  <div class="top-block">
    <div class="event-badge">{{ event_badge }}</div>
    <div class="destination-script" id="destScript">{{ destination }}</div>
    <div class="divider">
      <div class="div-line"></div>
      <div class="div-diamond"></div>
      <div class="div-line"></div>
    </div>
    <div class="hotel-row">
      <div class="hotel-pill">{{ hotel_label }}</div>
      <div class="hotel-name" id="hotelNameEl">{{ hotel_name }}</div>
    </div>
  </div>

  <!-- Bottom info panel -->
  <div class="bottom-panel">
    <!-- Duration -->
    <div class="bp-col">
      <span class="bp-label">Kohëzgjatja</span>
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;">
        <span class="bp-dur-row">
          <img src="{{ sun_icon }}"> {{ days }} Ditë
        </span>
        <div class="bp-dur-sep"></div>
        <span class="bp-dur-row">
          <img src="{{ moon_icon }}"> {{ nights }} Natë
        </span>
      </div>
    </div>

    <div class="bp-sep"></div>

    <!-- Price -->
    <div class="bp-col">
      <span class="bp-label">Çmimi</span>
      <span class="bp-price">{{ price }}€</span>
      <span class="bp-per">për person</span>
    </div>

    <div class="bp-sep"></div>

    <!-- Departure -->
    <div class="bp-col">
      <span class="bp-label">Nisja</span>
      <span class="bp-date">{{ departure_date }}</span>
    </div>
  </div>

  <!-- Swipe hint -->
  <div class="swipe-pill">
    <span class="swipe-arrow">›</span>
    <div class="swipe-dots">
      <div class="swipe-dot active"></div>
      <div class="swipe-dot"></div>
      <div class="swipe-dot"></div>
    </div>
  </div>

</div>

<script>
(function () {
  // Auto-size destination script
  var dest  = document.getElementById('destScript');
  var maxW  = 960;
  var hi = 160, lo = 60, best = 120;
  while (lo <= hi) {
    var mid = Math.floor((lo + hi) / 2);
    dest.style.fontSize = mid + 'px';
    if (dest.scrollWidth <= maxW) { best = mid; lo = mid + 1; }
    else { hi = mid - 1; }
  }
  dest.style.fontSize = best + 'px';

  // Auto-size hotel name
  var hotel = document.getElementById('hotelNameEl');
  var hiH = 44, loH = 20, bestH = 36;
  while (loH <= hiH) {
    var midH = Math.floor((loH + hiH) / 2);
    hotel.style.fontSize = midH + 'px';
    if (hotel.scrollWidth <= 820) { bestH = midH; loH = midH + 1; }
    else { hiH = midH - 1; }
  }
  hotel.style.fontSize = bestH + 'px';
})();
</script>
</body>
</html>
