<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins';  font-weight: 700;    src: url('{{ font_poppins }}')  format('truetype'); }
  @font-face { font-family: 'Exo2';     font-weight: 600;    src: url('{{ font_exo2 }}')     format('opentype'); }
  @font-face { font-family: 'Biryani';  font-weight: normal; src: url('{{ font_biryani }}')  format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #040d1e;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    background-image: url('{{ bg_image }}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* One flat uniform overlay — same darkness everywhere */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(4, 13, 30, 0.46);
    z-index: 2;
  }

  /* ── Icon — white circle centered at the very top ── */
  .icon-top {
    position: absolute;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.10);
    border: 2px solid rgba(255, 255, 255, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    box-shadow:
      0 0 0 10px rgba(255, 255, 255, 0.04),
      0 0 0 22px rgba(255, 255, 255, 0.02),
      0 16px 48px rgba(0, 0, 0, 0.35);
  }

  .icon-top img {
    width: 86px;
    height: 86px;
    object-fit: contain;
  }

  /* ── Event badge top-center (below icon) ── */
  .event-badge {
    position: absolute;
    top: 232px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #2185e0, #1565C0);
    color: #fff;
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 12px 36px;
    border-radius: 40px;
    border: 1.5px solid rgba(255,255,255,0.35);
    z-index: 20;
    white-space: nowrap;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  .event-badge.hidden { display: none; }

  /* ── Content pushed to bottom half ── */
  .bottom-stack {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 0 64px 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Destination ── */
  .destination-text {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 144px;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 8px;
    text-align: center;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0,0,0,0.70);
    margin-bottom: 14px;
  }

  /* Accent line under destination */
  .accent-line {
    width: 560px;
    height: 1px;
    margin-bottom: 48px;
    background: linear-gradient(to right,
      transparent 0%,
      rgba(255,255,255,0.20) 15%,
      rgba(255,255,255,0.60) 40%,
      rgba(33,133,224,1.0)  50%,
      rgba(255,255,255,0.60) 60%,
      rgba(255,255,255,0.20) 85%,
      transparent 100%
    );
    position: relative;
  }

  .accent-line::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    width: 9px; height: 9px;
    background: #1565C0;
    box-shadow: 0 0 8px rgba(33,133,224,0.9);
  }

  /* ── Price + contact ── */
  .info-row {
    display: flex;
    align-items: center;
    gap: 48px;
    margin-bottom: 44px;
  }

  .price-badge {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 68px;
    padding: 14px 56px;
    border-radius: 60px;
    border: 1.5px solid rgba(255,255,255,0.42);
    box-shadow:
      0 10px 40px rgba(21,101,192,0.65),
      inset 0 1px 0 rgba(255,255,255,0.24);
    white-space: nowrap;
    letter-spacing: -0.5px;
  }

  .v-divider {
    width: 1.5px;
    height: 80px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.40), transparent);
    flex-shrink: 0;
  }

  .contact-block { text-align: left; }

  .c-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.72);
    display: block;
    margin-bottom: 8px;
  }

  .c-phone {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 38px;
    color: #ffffff;
    letter-spacing: -0.5px;
  }

  /* ── Includes ── */
  .includes-line {
    font-family: 'Biryani', sans-serif;
    font-size: 22px;
    color: rgba(255,255,255,0.88);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    text-align: center;
  }
  .includes-line.hidden { display: none; }
</style>
</head>
<body>
<div class="canvas">

  <div class="bg"></div>
  <div class="overlay"></div>

  <!-- Icon white circle at top center -->
  <div class="icon-top">
    <img src="{{ venture_icon_white }}" alt="">
  </div>

  <div class="event-badge {{ event_badge_hidden }}">{{ event_badge }}</div>

  <!-- All info pushed to bottom -->
  <div class="bottom-stack">

    <div class="destination-text" id="destText">{{ destination }}</div>

    <div class="accent-line"></div>

    <div class="info-row">
      <div class="price-badge">{{ price }}€</div>
      <div class="v-divider"></div>
      <div class="contact-block">
        <span class="c-label">Reservo Tani</span>
        <span class="c-phone">049/45&nbsp;725–726</span>
      </div>
    </div>

    <div class="includes-line {{ includes_hidden }}">Në çmim përfshihet: {{ includes_text }}</div>

  </div>

</div>

<script>
  (function () {
    var el = document.getElementById('destText');
    var maxW = 980;
    var hi = 144, lo = 48, best = 100;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollWidth <= maxW) { best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  })();
</script>
</body>
</html>
