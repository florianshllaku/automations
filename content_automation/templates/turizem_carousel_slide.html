<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url('{{ font_poppins }}') format('truetype'); }
  @font-face { font-family: 'Exo2'; font-weight: 600; src: url('{{ font_exo2 }}') format('opentype'); }
  @font-face { font-family: 'Bigtimes'; src: url('{{ font_bigtimes }}') format('opentype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body, html { width: 1080px; height: 1080px; overflow: hidden; background: #020c1e; }
  .canvas { position: relative; width: 1080px; height: 1080px; }

  /* Background */
  .bg {
    position: absolute; inset: 0;
    background-image: url('{{ bg_image }}');
    background-size: cover; background-position: center;
    z-index: 1;
  }

  /* Top + bottom linear fades only — no radial corner darkening */
  .overlay-top {
    position: absolute; top: 0; left: 0; right: 0; height: 240px;
    background: linear-gradient(to bottom, rgba(2,12,30,0.65) 0%, transparent 100%);
    z-index: 3;
  }

  /* Bottom fade for text */
  .overlay-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; height: 320px;
    background: linear-gradient(to top, rgba(2,12,30,0.82) 0%, rgba(2,12,30,0.28) 55%, transparent 100%);
    z-index: 3;
  }

  {{ frame_css }}

  /* ── Logo — centered on top frame line ── */
  .logo-wrap {
    position: absolute;
    top: 17px; left: 0; right: 0;
    display: flex; justify-content: center;
    z-index: 20;
  }
  .logo-wrap img { height: 70px; width: auto; object-fit: contain; }

  /* ── Content slot — centered bottom ── */
  .content-slot {
    position: absolute;
    bottom: 100px; left: 80px; right: 80px;
    z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }

  .slide-title {
    font-family: 'Bigtimes', sans-serif;
    font-size: 82px; color: #fff; text-align: center; line-height: 1.0;
    text-shadow:
      0 0 80px rgba(24,119,242,0.35),
      0 0 40px rgba(0,0,0,0.55),
      0 5px 22px rgba(0,0,0,0.80);
    white-space: nowrap;
  }

  .slide-subtitle {
    font-family: 'Exo2', sans-serif; font-weight: 600;
    font-size: 19px; letter-spacing: 6px; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  .slide-title.hidden, .slide-subtitle.hidden { display: none; }

</style>
</head>
<body>
<div class="canvas">

  <div class="bg"></div>
  <div class="overlay-top"></div>
  <div class="overlay-bottom"></div>

  {{ frame_html }}

  <!-- Logo centered top -->
  <div class="logo-wrap">
    <img src="{{ logo_src }}" alt="Ventura Travel">
  </div>

  <!-- Optional title + subtitle centered bottom -->
  <div class="content-slot">
    <div class="slide-title {{ title_hidden }}">{{ slide_title }}</div>
    <div class="slide-subtitle {{ subtitle_hidden }}">{{ slide_subtitle }}</div>
  </div>

</div>
</body>
</html>
