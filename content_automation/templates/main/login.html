<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Studio — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #080808;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.025) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Grid pattern */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      padding: 20px;
    }

    /* Logo / wordmark */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px; height: 44px;
      background: #f0f0f0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      color: #080808;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    .brand-name {
      font-size: 18px;
      font-weight: 700;
      color: #f0f0f0;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 12px;
      color: #3a3a3a;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }

    /* Card */
    .card {
      background: #111;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 32px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #f0f0f0;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: #444;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.3;
      pointer-events: none;
    }
    .field input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      font-size: 14px;
      color: #f0f0f0;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: rgba(255,255,255,0.25);
    }
    .field input::placeholder { color: #333; }

    /* Toggle password */
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #3a3a3a;
      padding: 0;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .toggle-pw:hover { color: #777; }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: #f0f0f0;
      color: #080808;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.2px;
    }
    .btn-submit:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    .error-msg {
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.2);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 13px;
      color: #ff6b6b;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #222;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="brand">
      <div class="brand-icon">CS</div>
      <div class="brand-name">Content Studio</div>
      <div class="brand-sub">Secure Access</div>
    </div>

    <div class="card">
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Enter your credentials to continue</div>

      {% if error %}
      <div class="error-msg">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post">
        <div class="field">
          <label>Username</label>
          <div class="input-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" name="username" placeholder="username" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="input-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input type="password" id="pw" name="password" placeholder="••••••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" onclick="togglePw()" id="toggleBtn">
              <svg id="eye-show" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eye-hide" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit">Access Studio</button>
      </form>
    </div>

    <div class="footer-note">Authorized personnel only</div>
  </div>

  <script>
    function togglePw() {
      const inp = document.getElementById('pw');
      const show = document.getElementById('eye-show');
      const hide = document.getElementById('eye-hide');
      if (inp.type === 'password') {
        inp.type = 'text';
        show.style.display = 'none';
        hide.style.display = '';
      } else {
        inp.type = 'password';
        show.style.display = '';
        hide.style.display = 'none';
      }
    }
  </script>
</body>
</html>
