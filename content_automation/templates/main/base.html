<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Content Studio{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:      #123abc;
      --accent-dim:  rgba(18,58,188,0.07);
      --accent-glow: rgba(18,58,188,0.15);
      --bg:          #f4f5f9;
      --sb:          #ffffff;
      --card:        #ffffff;
      --card2:       #f0f1f6;
      --border:      rgba(0,0,0,0.08);
      --border2:     rgba(0,0,0,0.14);
      --text:        #0d0d14;
      --muted:       #9a9ab0;
      --muted2:      #6a6a82;
      --r:           12px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      -webkit-font-smoothing: antialiased;
    }

    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; }
    input, textarea, select { font-family: inherit; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ─── Sidebar ─────────────────────────────────────── */
    .sidebar {
      width: 220px;
      min-height: 100vh;
      flex-shrink: 0;
      background: var(--sb);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sb-head {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sb-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .sb-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }
    .sb-wordmark {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sb-biz-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .sb-biz-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .sb-nav {
      flex: 1;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow-y: auto;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted2);
      transition: background 0.15s, color 0.15s;
    }
    .sb-item:hover {
      background: var(--bg);
      color: var(--text);
    }
    .sb-item.active {
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 600;
    }
    .sb-item svg {
      flex-shrink: 0;
      width: 15px; height: 15px;
      opacity: 0.7;
    }
    .sb-item.active svg { opacity: 1; }

    .sb-footer {
      padding: 8px 8px 16px;
      border-top: 1px solid var(--border);
    }

    /* ─── Main area ─────────────────────────────────────── */
    .main {
      flex: 1;
      min-height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .page {
      flex: 1;
      padding: 36px 40px;
    }

    /* ─── Reusable components ───────────────────────────── */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .page-header-left h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }
    .page-header-left h1 span { color: var(--accent); }
    .page-header-left p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: none;
      border-radius: 9px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      line-height: 1;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-primary:active { transform: none; }
    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border2);
    }
    .btn-secondary:hover { border-color: rgba(0,0,0,0.22); background: var(--bg); }
    .btn-sm { padding: 7px 13px; font-size: 12px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--accent-dim);
      color: var(--accent);
    }
    .badge-neutral {
      background: var(--card2);
      color: var(--muted2);
    }

    .stats-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 18px 22px;
      flex: 1;
      min-width: 110px;
    }
    .stat-card .s-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -1px;
      line-height: 1;
    }
    .stat-card .s-lbl {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Posts grid */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .post-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .post-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(18,58,188,0.08); }
    .post-thumb {
      width: 100%;
      aspect-ratio: 4/5;
      background: var(--card2);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .post-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .post-thumb-ph { text-align: center; color: var(--muted); font-size: 11px; }
    .post-info { padding: 10px 12px 12px; }
    .post-info .headline {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 4px;
    }
    .post-info .date {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      border: 1.5px dashed var(--border2);
      border-radius: 14px;
      color: var(--muted);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.25; }
    .empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; margin-bottom: 20px; }

    /* Section header */
    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-hdr h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .section-hdr a { font-size: 12px; color: var(--accent); font-weight: 600; }

    /* Coming soon */
    .coming-soon {
      text-align: center;
      padding: 80px 24px;
      border: 1.5px dashed var(--border2);
      border-radius: 14px;
    }
    .coming-soon .cs-icon { font-size: 36px; margin-bottom: 16px; opacity: 0.4; }
    .coming-soon h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .coming-soon p { font-size: 13px; color: var(--muted); }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-logo">
        <div class="sb-icon">CS</div>
        <div class="sb-wordmark">Studio</div>
      </div>
      <div class="sb-biz-name">{{ biz.name }}</div>
      <div class="sb-biz-sub">{{ biz.sub }}</div>
    </div>

    <nav class="sb-nav">
      <a href="/dashboard" class="sb-item {% if active == 'dashboard' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </a>

      <a href="/create" class="sb-item {% if active == 'create' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Create Post
      </a>

      <a href="/scheduling" class="sb-item {% if active == 'scheduling' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Scheduling
      </a>

      <a href="/history" class="sb-item {% if active == 'history' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
        History
      </a>

      <a href="/analytics" class="sb-item {% if active == 'analytics' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
        Analytics
      </a>
    </nav>

    <div class="sb-footer">
      <a href="/profile" class="sb-item {% if active == 'profile' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </a>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    {% block content %}{% endblock %}
  </div>

</body>
</html>
