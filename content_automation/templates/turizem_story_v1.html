<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Poppins';  font-weight: 700;    src: url('{{ font_poppins }}')  format('truetype'); }
  @font-face { font-family: 'Exo2';     font-weight: 600;    src: url('{{ font_exo2 }}')     format('opentype'); }
  @font-face { font-family: 'Biryani';  font-weight: normal; src: url('{{ font_biryani }}')  format('truetype'); }
  @font-face { font-family: 'Bigtimes'; font-weight: normal; src: url('{{ font_bigtimes }}') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body, html {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #040d1e;
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
  }

  /* ── Full-bleed background photo fills right side ── */
  .bg {
    position: absolute;
    top: 0; left: 380px; right: 0; bottom: 0;
    background-image: url('{{ bg_image }}');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* Soft shadow bleeding from panel onto photo */
  .bg::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 80px;
    background: linear-gradient(to right, rgba(4,13,30,0.7) 0%, transparent 100%);
  }

  /* ── Left dark panel ── */
  .panel {
    position: absolute;
    top: 0; left: 0;
    width: 380px;
    height: 1920px;
    background: linear-gradient(170deg, #040d1e 0%, #0a1a3a 60%, #040d1e 100%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 32px 52px;
  }

  /* Subtle vertical accent line on right edge of panel */
  .panel::after {
    content: '';
    position: absolute;
    top: 80px; bottom: 80px; right: 0;
    width: 2px;
    background: linear-gradient(to bottom,
      transparent 0%,
      rgba(33,133,224,0.6) 20%,
      rgba(33,133,224,0.8) 50%,
      rgba(33,133,224,0.6) 80%,
      transparent 100%
    );
  }

  /* ── Venture icon at top ── */
  .icon-wrap {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(33,133,224,0.15);
    border: 2px solid rgba(33,133,224,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 52px;
    box-shadow: 0 0 32px rgba(33,133,224,0.3);
  }

  .icon-wrap img {
    width: 68px;
    height: 68px;
    object-fit: contain;
  }

  /* ── Agency name small ── */
  .agency-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(33,133,224,0.9);
    margin-bottom: 28px;
  }

  /* ── Destination large vertical ── */
  .destination-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .destination-text {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 84px;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: -1px;
    text-align: center;
    line-height: 1;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    text-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  /* ── Divider ── */
  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(to right, transparent, rgba(33,133,224,0.8), transparent);
    margin: 36px auto;
  }

  /* ── Price badge ── */
  .price-badge {
    background: linear-gradient(160deg, #2185e0 0%, #1565C0 55%, #0e52a8 100%);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 52px;
    padding: 12px 44px;
    border-radius: 60px;
    white-space: nowrap;
    border: 1.5px solid rgba(255,255,255,0.35);
    box-shadow: 0 8px 28px rgba(21,101,192,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
    margin-bottom: 32px;
  }

  /* ── Contact block ── */
  .contact-block {
    text-align: center;
    margin-bottom: 40px;
  }

  .c-label {
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    display: block;
    margin-bottom: 6px;
  }

  .c-phone {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: #ffffff;
    letter-spacing: -0.3px;
  }

  /* ── Includes at bottom ── */
  .includes-line {
    font-family: 'Biryani', sans-serif;
    font-size: 17px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1.8px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.5;
  }
  .includes-line.hidden { display: none; }

  /* ── Event badge top-right corner of photo ── */
  .event-badge {
    position: absolute;
    top: 48px;
    right: 36px;
    background: linear-gradient(135deg, #2185e0, #1565C0);
    color: #fff;
    font-family: 'Exo2', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 40px;
    border: 1.5px solid rgba(255,255,255,0.35);
    z-index: 20;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  }
  .event-badge.hidden { display: none; }

  /* ── Destination horizontal label on photo ── */
  .dest-photo-label {
    position: absolute;
    bottom: 48px;
    right: 36px;
    font-family: 'Bigtimes', serif;
    font-size: 36px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 4px;
    z-index: 20;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div class="canvas">

  <!-- Photo on right -->
  <div class="bg"></div>

  <!-- Event badge -->
  <div class="event-badge {{ event_badge_hidden }}">{{ event_badge }}</div>

  <!-- Left panel -->
  <div class="panel">
    <div class="icon-wrap">
      <img src="{{ venture_icon_white }}" alt="">
    </div>

    <div class="agency-label">Ventura Travel</div>

    <div class="destination-wrap">
      <div class="destination-text" id="destText">{{ destination }}</div>
    </div>

    <div class="divider"></div>

    <div class="price-badge">{{ price }}€</div>

    <div class="contact-block">
      <span class="c-label">Reservo Tani</span>
      <span class="c-phone">049/45 &nbsp;725–726</span>
    </div>

    <div class="includes-line {{ includes_hidden }}">Në çmim përfshihet:<br>{{ includes_text }}</div>
  </div>

  <!-- Subtle destination watermark on photo -->
  <div class="dest-photo-label">{{ destination }}</div>

</div>

<script>
  (function () {
    var el = document.getElementById('destText');
    var maxH = 620;
    var hi = 88, lo = 28, best = 60;
    while (lo <= hi) {
      var mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (el.scrollHeight <= maxH) { best = mid; lo = mid + 1; }
      else { hi = mid - 1; }
    }
    el.style.fontSize = best + 'px';
  })();
</script>
</body>
</html>
