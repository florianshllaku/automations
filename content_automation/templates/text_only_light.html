<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @font-face {
    font-family: 'Heading';
    src: url('{{ brand.font_files.heading }}');
  }
  @font-face {
    font-family: 'Body';
    src: url('{{ brand.font_files.body }}');
  }

  body {
    width: {{ width }}px;
    height: {{ height }}px;
    background-color: #F7F7F7;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px 88px 92px 88px;
    overflow: hidden;
  }

  /* TOP: Logo */
  .logo-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }
  .logo {
    height: 48px;
  }

  /* MIDDLE: Main content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 36px;
  }

  .accent-bar {
    width: 72px;
    height: 7px;
    background-color: {{ brand.accent_color }};
    border-radius: 4px;
  }

  .headline {
    font-family: 'Heading', 'Poppins', sans-serif;
    font-size: 82px;
    font-weight: 700;
    color: {{ brand.text_color }};
    line-height: 1.08;
    letter-spacing: -1.5px;
    word-break: break-word;
  }

  /* BOTTOM */
  .bottom-row {
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 20px;
  }

  .divider {
    width: 100%;
    height: 1.5px;
    background: rgba(8,8,8,0.1);
  }

  .business-name {
    font-family: 'Heading', 'Poppins', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: {{ brand.accent_color }};
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="logo-row">
    {% if logo_path %}
      <img class="logo" src="{{ logo_path }}" alt="logo">
    {% endif %}
  </div>

  <div class="content">
    <div class="accent-bar"></div>
    <div class="headline">{{ headline }}</div>
  </div>

  <div class="bottom-row">
    <div class="divider"></div>
    <div class="business-name">{{ business.name }}</div>
  </div>

</body>
</html>
